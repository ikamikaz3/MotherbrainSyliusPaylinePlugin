services:
    
    motherbrain_sylius_payline.payline:
        class: Payum\Core\Bridge\Symfony\Builder\GatewayFactoryBuilder
        arguments:
            - 'Motherbrain\SyliusPaylinePlugin\Payum\PaylineGatewayFactory'
        tags:
            - name: payum.gateway_factory_builder
              factory: 'payline'
              label: 'motherbrain_sylius_payline_plugin.ui.payline'
    
    motherbrain_sylius_payline.action.convert_payment:
        public: true
        class: Motherbrain\SyliusPaylinePlugin\Payum\Action\ConvertPaymentAction
        arguments:
            $detailsProvider: '@motherbrain_sylius_payline.provider.details'
        tags:
            - name: payum.action
              factory: payline
              alias: motherbrain.sylius_payline.convert_payment

    motherbrain_sylius_payline.extension.update_payment_state:
        public: true
        class: Motherbrain\SyliusPaylinePlugin\Payum\Extension\UpdatePaymentStateExtension
        arguments:
            $factory: '@sm.factory'
            # Alias of "@payum.storage.sylius_component_core_model_payment"
            # or "@payum.storage.app_entity_payment_payment" or any other available
            # Payum storage handling Payment entity
            $storage: '@payum.storage.motherbrain_sylius_payment'
            $getStatusRequestFactory: '@sylius.factory.payum_get_status_action'
        tags:
            - name: payum.extension
              factory: 'payline'
              alias: motherbrain.sylius_payline.extension.update_payment_state

    motherbrain_sylius_payline.action.resolve_next_route:
        public: true
        class: Motherbrain\SyliusPaylinePlugin\Payum\Action\ResolveNextRouteAction
        arguments:
            $requestStack: '@request_stack'
        tags:
            - name: payum.action
              factory: payline
              alias: motherbrain.sylius_payline.resolve_next_route        
